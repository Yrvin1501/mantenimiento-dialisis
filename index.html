// 🟢 SOLUCIÓN AL ERROR: Declaración e implementación de getToken()
function getToken() {
  return localStorage.getItem('github-token') || '';
}

function parseDateStr(s) {
  if (!s) return null;
  const parts = String(s).split('-');
  if (parts.length !== 3) return null;
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d.getTime())) return null;
  d.setHours(0, 0, 0, 0);
  return d;
}

function daysFromToday(date) {
  if (!date) return null;
  return Math.round((date - TODAY) / 86400000);
}

function getStatus(days) {
  if (days === null) return 'na';
  if (days < 0) return 'vencido';
  if (days <= 7) return 'critico';
  if (days <= 30) return 'proximo';
  return 'ok';
}

function statusLabel(s) {
  return { vencido:'Vencido', critico:'Crítico', proximo:'Próximo', ok:'Al día', na:'N/A' }[s] || s;
}

function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function toInputDate(d) {
  if (!d) return '';
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yy}-${mm}-${dd}`;
}

function loadInitialData() {
  _insertOrder = 0;
  nextId = 1;
  events = RAW.map(r => ({
    id: nextId++,
    _order: _insertOrder++,
    hospital: r[0],
    tipo: r[1],
    fecha: parseDateStr(r[2]),
    fechaStr: r[2] || '',
    notes: r[3] || '', // Mapeado a .notas internamente
    notas: r[3] || ''
  }));
}

function serializeEvents() {
  return JSON.stringify({
    nextId, _insertOrder,
    events: events.map(e => ({
      ...e,
      fecha: e.fecha
        ? `${e.fecha.getFullYear()}-${String(e.fecha.getMonth()+1).padStart(2,'0')}-${String(e.fecha.getDate()).padStart(2,'0')}`
        : null
    }))
  }, null, 2);
}

function deserializeEvents(raw) {
  const data = JSON.parse(raw);
  if (!data || !Array.isArray(data.events) || data.events.length === 0) {
    throw new Error('No data structure parsed');
  }
  nextId = data.nextId || 1;
  _insertOrder = data._insertOrder || 0;
  events = data.events.map((e, i) => ({
    ...e,
    _order: e._order !== undefined ? e._order : i,
    fecha: parseDateStr(e.fecha),
    notas: e.notas || e.notes || ''
  }));
}

async function ghGet() {
  const token = getToken();
  if (!token) return null;
  try {
    const r = await fetch(
      `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
      { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('GitHub Status ' + r.status);
    const j = await r.json();
    _ghSha = j.sha;
    return decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
  } catch(e) { console.error(e); return null; }
}

async function ghPut(content) {
  const token = getToken();
  if (!token) return false;
  try {
    const body = { message: 'Dashboard auto-update', content: btoa(unescape(encodeURIComponent(content))), branch: GH_BRANCH };
    if (_ghSha) body.sha = _ghSha;
    const r = await fetch(
      `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,
      { method: 'PUT', headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    );
    if (!r.ok) { const e = await r.json(); throw new Error(e.message); }
    const j = await r.json();
    _ghSha = j.content.sha;
    return true;
  } catch(e) { console.error('ghPut error:', e); return false; }
}

async function saveToStorage() {
  const payload = serializeEvents();
  localStorage.setItem('dialisis-events', payload);
  const token = getToken();
  if (!token) { showSaveIndicator('✓ Guardado local (sin sync)'); return; }
  showSaveIndicator('⏳ Sincronizando…');
  const ok = await ghPut(payload);
  showSaveIndicator(ok ? '✓ Sincronizado con GitHub' : '⚠ Error al subir a GitHub', !ok);
}

async function loadFromStorage() {
  const token = getToken();
  if (token) {
    showSaveIndicator('⏳ Cargando desde GitHub…');
    const remote = await ghGet();
    if (remote) {
      try {
        deserializeEvents(remote);
        localStorage.setItem('dialisis-events', remote);
        showSaveIndicator('✓ Datos sincronizados');
        return true;
      } catch(e) { console.error(e); }
    }
  }
  const raw = localStorage.getItem('dialisis-events');
  if (raw) {
    try {
      deserializeEvents(raw);
      showSaveIndicator('✓ Datos locales cargados');
      return true;
    } catch(e) { console.error(e); }
  }
  return false;
}

function showSaveIndicator(msg, warn) {
  let ind = document.getElementById('save-ind');
  if (!ind) {
    ind = document.createElement('span');
    ind.id = 'save-ind';
    ind.style.cssText = 'font-size:12px;padding:3px 10px;border-radius:5px;margin-left:12px;transition:opacity 0.4s;font-weight:500;';
    document.querySelector('.export-row').appendChild(ind);
  }
  ind.textContent = msg;
  ind.style.background = warn ? '#fdeaea' : '#eaf3de';
  ind.style.color = warn ? '#a32d2d' : '#3b6d11';
  ind.style.opacity = '1';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { ind.style.opacity = '0'; }, 4000);
}

}

function setTab(tabName, el) {
  currentTab = tabName;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function filteredEvents() {
  const h = document.getElementById('filter-hospital').value;
  const t = document.getElementById('filter-tipo').value;
  const e = document.getElementById('filter-estado').value;
  const s = document.getElementById('filter-search').value.toLowerCase();
  return events.filter(ev => {
    const days = daysFromToday(ev.fecha);
    const status = getStatus(days);
    if (h && ev.hospital !== h) return false;
    if (t && ev.tipo !== t) return false;
    if (e && status !== e) return false;
    if (currentTab !== 'all' && status !== currentTab) return false;
    if (s && !(ev.hospital.toLowerCase().includes(s) || ev.tipo.toLowerCase().includes(s) || (ev.notas||'').toLowerCase().includes(s))) return false;
    return true;
  });
}

function sortedEvents(arr) {
  if (!userSorted) return [...arr].sort((a, b) => (a._order||0) - (b._order||0));
  return [...arr].sort((a, b) => {
    let va, vb;
    if (sortCol === 'hospital') { va = a.hospital; vb = b.hospital; }
    else if (sortCol === 'tipo') { va = a.tipo; vb = b.tipo; }
    else if (sortCol === 'fecha') { va = a.fecha ? a.fecha.getTime() : Infinity; vb = b.fecha ? b.fecha.getTime() : Infinity; }
    else { va = a.fecha ? daysFromToday(a.fecha) : 99999; vb = b.fecha ? daysFromToday(b.fecha) : 99999; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
}

function sortTable(col) {
  userSorted = true;
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  renderTable();
}

  const overdue = all.filter(s => s === 'vencido').length;
  const critico = all.filter(s => s === 'critico').length;
  const proximo = all.filter(s => s === 'proximo').length;
  const ok      = all.filter(s => s === 'ok').length;
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi total"><div class="num">${events.length}</div><div class="lbl">Total eventos</div></div>
    <div class="kpi overdue"><div class="num">${overdue}</div><div class="lbl">⛔ Vencidos</div></div>
    <div class="kpi"><div class="num" style="color:#ba7517">${critico}</div><div class="lbl">🔴 Críticos (≤7d)</div></div>
    <div class="kpi soon"><div class="num" style="color:#854f0b">${proximo}</div><div class="lbl">🟡 Próximos (≤30d)</div></div>
    <div class="kpi ok"><div class="num">${ok}</div><div class="lbl">🟢 Al día</div></div>`;
}

function renderAlerts() {
  const area = document.getElementById('alert-area');
  const overdue = events.filter(e => getStatus(daysFromToday(e.fecha)) === 'vencido');
  const critico = events.filter(e => getStatus(daysFromToday(e.fecha)) === 'critico');
  let html = '';
  if (overdue.length)
    html += `<div class="alert-banner danger"><span class="icon">⛔</span><strong>${overdue.length} intervención(es) VENCIDA(S):</strong> ${overdue.slice(0,5).map(e=>`${e.hospital} (${e.tipo})`).join(' | ')}${overdue.length>5?` y ${overdue.length-5} más…`:''}</div>`;
  if (critico.length)
    html += `<div class="alert-banner"><span class="icon">⚠️</span><strong>${critico.length} alerta(s) CRÍTICA(S) (≤7 días):</strong> ${critico.slice(0,4).map(e=>`${e.hospital} — ${e.tipo} (${daysFromToday(e.fecha)}d)`).join(' | ')}${critico.length>4?` y ${critico.length-4} más…`:''}</div>`;
  area.innerHTML = html;
}

  const tbody = document.getElementById('table-body');
  if (!arr.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:#888">No hay registros coincidentes con los filtros indicados.</td></tr>`;
    return;
  }
  tbody.innerHTML = arr.map(ev => {
    const days = daysFromToday(ev.fecha);
    const status = getStatus(days);
    const daysDisp = days === null ? '—' : (days < 0 ? `${days}d` : `+${days}d`);
    const daysCls  = days === null ? '' : (days < 0 ? 'neg' : (days <= 30 ? 'warn' : 'ok'));
    const notesHtml = ev.notas
      ? `<span class="notes-cell" title="${ev.notas.replace(/"/g,'&quot;')}">${ev.notas}</span>`
      : '<span style="color:#ccc">—</span>';
    return `<tr>
      <td><span class="hospital-tag">${ev.hospital}</span></td>
      <td>${ev.tipo}</td>
      <td class="editable" onclick="editDate(${ev.id})" title="Clic para modificar fecha rápidamente">
        <span id="date-disp-${ev.id}">${fmtDate(ev.fecha)}</span>
        <input type="date" class="inline-date" id="date-inp-${ev.id}" value="${ev.fecha ? toInputDate(ev.fecha) : ''}" style="display:none" onchange="commitDate(${ev.id})" onblur="cancelDate(${ev.id})">
      </td>
      <td class="days-cell ${daysCls}">${daysDisp}</td>
      <td><span class="badge ${status}">${statusLabel(status)}</span></td>
      <td>${notesHtml}</td>
      <td><div class="action-row">
        <button class="icon-btn" onclick="openEditModal(${ev.id}); event.stopPropagation();" title="Editar detalles">✏</button>
        <button class="icon-btn del" onclick="deleteEvent(${ev.id}); event.stopPropagation();" title="Eliminar registro">🗑</button>
      </div></td>
    </tr>`;
  }).join('');
}

// 🟢 EDICIÓN EN LÍNEA DE FECHAS
function editDate(id) {
  document.getElementById(`date-disp-${id}`).style.display = 'none';
  const inp = document.getElementById(`date-inp-${id}`);
  inp.style.display = 'inline-block';
  inp.focus();
}

function cancelDate(id) {
  setTimeout(() => {
    const inp = document.getElementById(`date-inp-${id}`);
    if(inp) inp.style.display = 'none';
    const disp = document.getElementById(`date-disp-${id}`);
    if(disp) disp.style.display = 'inline';
  }, 200);
}

function commitDate(id) {
  const val = document.getElementById(`date-inp-${id}`).value;
  const ev = events.find(e => e.id === id);
  if (ev) {
    ev.fecha = parseDateStr(val);
    ev.fechaStr = val;
    render();
    saveToStorage();
  }
}

// 🟢 MANEJO DE MODAL CRUD
function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = "Nuevo evento de mantenimiento";
  document.getElementById('m-hospital').value = "";
  document.getElementById('m-tipo').value = "";
  document.getElementById('m-fecha').value = "";
  document.getElementById('m-notas').value = "";
  document.getElementById('modal-overlay').classList.add('open');
}

function openEditModal(id) {
  editingId = id;
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  document.getElementById('modal-title').textContent = "Modificar evento de mantenimiento";
  document.getElementById('m-hospital').value = ev.hospital;
  document.getElementById('m-tipo').value = ev.tipo;
  document.getElementById('m-fecha').value = ev.fecha ? toInputDate(ev.fecha) : '';
  document.getElementById('m-notas').value = ev.notas || '';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveEvent() {
  const hosp = document.getElementById('m-hospital').value.trim();
  const tipo = document.getElementById('m-tipo').value.trim();
  const fech = document.getElementById('m-fecha').value;
  const nots = document.getElementById('m-notas').value.trim();

  if (!hosp || !tipo) { alert('Hospital y Tipo de mantenimiento son obligatorios'); return; }

  if (editingId === null) {
    events.push({
      id: nextId++,
      _order: _insertOrder++,
      hospital: hosp,
      tipo: tipo,
      fecha: parseDateStr(fech),
      fechaStr: fech,
      notas: nots
    });
  } else {
    const ev = events.find(e => e.id === editingId);
    if (ev) {
      ev.hospital = hosp;
      ev.tipo = tipo;
      ev.fecha = parseDateStr(fech);
      ev.fechaStr = fech;
      ev.notas = nots;
    }
  }
  closeModal();
  buildFilters();
  render();
  saveToStorage();
}

function deleteEvent(id) {
  if (!confirm('¿Desea eliminar de forma definitiva esta tarea de mantenimiento?')) return;
  events = events.filter(e => e.id !== id);
  buildFilters();
  render();
  saveToStorage();
}

// 🟢 MANEJO DEL TOKEN MODAL (SYNC)
function openTokenModal() {
  document.getElementById('token-input').value = getToken();
  document.getElementById('token-modal').classList.add('open');
}

function closeTokenModal() {
  document.getElementById('token-modal').classList.remove('open');
}

function saveToken() {
  const tk = document.getElementById('token-input').value.trim();
  if (tk) {
    localStorage.setItem('github-token', tk);
  } else {
    localStorage.removeItem('github-token');
  }
  closeTokenModal();
  loadFromStorage().then(() => {
    buildFilters();
    render();
  });
}

function clearToken() {
  if (confirm('¿Eliminar el token de sincronización almacenado localmente?')) {
    localStorage.removeItem('github-token');
    document.getElementById('token-input').value = "";
    _ghSha = null;
    closeTokenModal();
    render();
  }
}

// 🟢 EXPORTACIÓN A CSV
function exportCSV() {
  const activeEvents = filteredEvents();
  let csv = '\uFEFFHospital;Tipo de Mantenimiento;Fecha de Vencimiento;Dias Restantes;Estado;Notas\n';
  activeEvents.forEach(e => {
    const days = daysFromToday(e.fecha);
    const dDisp = days === null ? 'N/A' : days;
    const sDisp = statusLabel(getStatus(days));
    csv += `"${e.hospital.replace(/"/g,'""')}";"${e.tipo.replace(/"/g,'""')}";"${e.fecha ? toInputDate(e.fecha) : ''}";"${dDisp}";"${sDisp}";"${(e.notas||'').replace(/"/g,'""')}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.setAttribute("download", `control_vencimientos_dialisis_${toInputDate(new Date())}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// 🟢 ARRANQUE INICIAL AL CARGAR EL DOM
window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('today-display').textContent = TODAY.toLocaleDateString('es-ES', { 
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
  });

  const success = await loadFromStorage();
  if (!success) {
    loadInitialData();
  }
  buildFilters();
  render();
});

function render() {
  renderKPIs();
  renderAlerts();
  renderTable();
}
</script>
